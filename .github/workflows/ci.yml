name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything but Windows runs on Linux on purpose, Android's build among it. The packages under test have no platform in them —
# that is the point of them — and a private repository pays ten times as much for a macOS minute.
# A macOS job arrives with the first target that needs one.
jobs:
  fixtures:
    name: Fixtures match the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/check-fixtures.sh
      # The shaders are GLSL, and every backend's language is made from it and checked in. Without
      # the Vulkan SDK here, this checks each generated file's hashes: of the GLSL it was made from,
      # and of itself.
      - run: node scripts/shaders.mjs --check
      # What is too large to check in, or never the same twice: whole-song plans, and every voice
      # rendered in a real Chromium. Made here from the pinned reference and handed to the Swift
      # job, so those tests run in CI rather than only on a laptop that happened to make them.
      - name: Generate the large fixtures
        run: |
          node --no-warnings conformance/emit/emit.mjs --full
          node --no-warnings conformance/emit/emit-audio.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: generated-fixtures
          path: conformance/generated
          retention-days: 3

  swift:
    name: Swift
    needs: fixtures
    runs-on: ubuntu-latest
    # Match the supported desktop/package runtime; GTK 4.8 has window-teardown defects.
    container: swift:6.4-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    env:
      DRIFTBOX_REQUIRE_GENERATED: 1
      # The GPU layer's OpenGL ES backend runs its contract tests on Mesa's software rasteriser,
      # with no display: Linux's WARP.
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - name: Linux graphics and audio development libraries and Python
        run: apt-get update && apt-get install -y --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri libpipewire-0.3-dev libasound2-dev libgtk-4-dev fonts-dejavu-core xvfb xauth desktop-file-utils shared-mime-info python3 python3-gi gcc
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-fixtures
          path: conformance/generated
      - name: Format
        run: swift format lint --strict -r Sources Tests Package.swift
      # The release scripts' checks, which sign, upload and publish nothing.
      - name: Release scripts
        run: python3 scripts/test-release.py && python3 scripts/test-android-release.py && python3 scripts/test-linux-package.py
      - name: Linux document dialog bridge
        run: scripts/test-linux-dialogs.sh
      - name: Linux GPU diagnostics
        run: swift run driftbox-play --gpu-info
      - name: Linux window lifecycle
        run: xvfb-run -a env EGL_PLATFORM=x11 GDK_BACKEND=x11 SWIFT_IS_CURRENT_EXECUTOR_LEGACY_MODE_OVERRIDE=swift6 swift run driftbox-linux-window --self-test
      - name: Linux desktop
        run: xvfb-run -a env EGL_PLATFORM=x11 GDK_BACKEND=x11 SWIFT_IS_CURRENT_EXECUTOR_LEGACY_MODE_OVERRIDE=swift6 swift run driftbox-linux --silent --smoke-test
      - name: Audio targets stay constrained
        run: scripts/check-constrained.sh

      - name: Test
        run: swift test
        # Strict actor isolation, as an app runs with: a closure made on the main actor and called
        # from an audio or MIDI thread traps here, rather than only in the app.
        env:
          SWIFT_IS_CURRENT_EXECUTOR_LEGACY_MODE_OVERRIDE: swift6

  linux-gtk:
    name: Linux GTK lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: GTK and private display test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-4-dev xvfb xauth dbus-x11 sway wtype
      - name: X11 dialogs
        run: scripts/test-linux-dialogs.sh
      - name: Native Wayland dialogs
        run: scripts/test-linux-wayland.sh

  # Whether a change can reach the Windows build, since a Windows minute costs twice a Linux one.
  # It can unless every file changed is in something that compiles to nothing there — the Mac app,
  # the Metal backend, GLES, the Android app and its C modules, all behind `#if`s Windows fails —
  # or is not code at all. When it cannot tell, it says yes.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.windows.outputs.relevant }}
    steps:
      - id: windows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # The comparison lists at most 300 files; a push that many long is simply run.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq 'if (.files | length) < 300 then .files[].filename else "unknown" end') || files=""
          else
            files=""
          fi
          relevant=false
          [ -z "$files" ] && relevant=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              Sources/Driftbox/*|Sources/DriftboxApp/*|Sources/DriftboxGPUMetal/*|Tests/DriftboxAppTests/*) ;;
              Sources/DriftboxGPUGLES/*|Sources/DriftboxAndroid/*|Sources/CAAudio/*|Sources/CAMidi/*|Sources/CGLES/*) ;;
              android/*|shaders/*|scripts/*|*.md|LICENSE|.swift-format|.gitignore) ;;
              *) relevant=true ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Windows is $([ $relevant = true ] && echo needed || echo not needed) for this change"

  # The Android app and player, built as the Mac and Windows build them, by `android-app.sh` and
  # `android-build.sh`, and not run: the phone's checks need a phone, or an arm64 emulator, which
  # a Linux runner has neither of. What this holds is that the Android build builds, from any host.
  # The versions go together: swift.org's SDK for Android is built for one toolchain, and against
  # one NDK's C++ library, which swift.org names (r30 for 6.4).
  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      SWIFT_RELEASE: swift-6.4.0-RELEASE
      ANDROID_SDK_CHECKSUM: 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/swift
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
          key: android-${{ env.SWIFT_RELEASE }}
      - name: Swift, and its SDK for Android
        run: |
          if [ ! -x ~/swift/usr/bin/swiftc ]; then
            mkdir -p ~/swift
            curl -fsSL "https://download.swift.org/${SWIFT_RELEASE,,}/ubuntu2404/$SWIFT_RELEASE/$SWIFT_RELEASE-ubuntu24.04.tar.gz" |
              tar xz -C ~/swift --strip-components 1
          fi
          echo ~/swift/usr/bin >> "$GITHUB_PATH"
          if ! ~/swift/usr/bin/swift sdk list | grep -q "${SWIFT_RELEASE}_android"; then
            ~/swift/usr/bin/swift sdk install --checksum "$ANDROID_SDK_CHECKSUM" \
              "https://download.swift.org/${SWIFT_RELEASE,,}/android-sdk/$SWIFT_RELEASE/${SWIFT_RELEASE}_android.artifactbundle.tar.gz"
          fi
      - name: The NDK the SDK was built against, and the platform the app targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" \
            "platforms;android-$(sed -n 's/^target_sdk=//p' scripts/android-app.sh)" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # As it is released: the checks left out, which differ only in a little Java that every run
      # of them on a phone builds.
      - name: Build the app
        run: sh scripts/android-app.sh release
      - name: Build the player
        run: sh scripts/android-build.sh build

  # The Windows host is the one target Linux cannot build, so it is built and tested here, over
  # everything else as well: the core is meant to be platform-free, and this is where that is kept.
  # Release, because a debug build does not link on Windows yet (see the README's "Windows").
  windows:
    name: Windows
    needs: [fixtures, scope]
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      DRIFTBOX_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-fixtures
          path: conformance/generated
      # Sometimes the installer succeeds and leaves the toolchain off PATH, and the action's own
      # version check then fails to find `swift`: compnerd/gha-setup-swift#58, open upstream. So
      # the action may fail, the next step puts the toolchain back if that is all that went wrong,
      # and the step after says whether Swift is really there. Nothing the action does after its
      # version check matters to a 6.4 toolchain. Drop all three once #58 is released.
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057  # v0.5.0, pinned
        id: swift
        continue-on-error: true
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Find the toolchain if the installer left it off PATH
        if: steps.swift.outcome == 'failure'
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) { exit 0 }
          if (-not $env:SDKROOT -or $env:SDKROOT -notmatch '\\Platforms\\') {
            Write-Host "::error::Swift is not on PATH and SDKROOT does not say where it was installed"
            exit 1
          }
          $root = $env:SDKROOT.Substring(0, $env:SDKROOT.IndexOf('\Platforms\'))
          $found = @(Get-ChildItem -Path "$root\Toolchains\*\usr\bin\swift.exe" -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            Write-Host "::error::Expected one Swift toolchain under $root\Toolchains, found $($found.Count)"
            exit 1
          }
          Write-Host "::warning::The Swift installer left its toolchain off PATH; adding $($found[0].DirectoryName)"
          $found[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Swift is installed
        run: swift --version
      - name: Build
        run: swift build -c release --build-tests --build-system native -Xswiftc -enable-testing
      - name: Test
        run: swift test -c release --skip-build --build-system native --skip MIDISchedulerTests
      # The MIDI scheduler is held to a few milliseconds, and alongside the rest of the suite —
      # Direct3D on the software rasteriser, the DSP — a runner's few cores are busy enough that the
      # whole process is sometimes not scheduled for 40ms or more, at any thread priority. So it runs
      # on its own, afterwards, where the only thing it can be late for is itself.
      - name: Test the MIDI scheduler on its own
        run: swift test -c release --skip-build --build-system native --filter MIDISchedulerTests
